spring:
  application:
    name: yeohaeng-pick
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: ${SERVER_PORT:18081}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10
    # Oracle은 타입을 모르는 NULL 바인딩에 OTHER(1111)를 허용하지 않습니다.
    jdbc-type-for-null: "NULL"
app:
  # 키는 서버 환경변수로만 주입합니다. 브라우저용 지도 키와 서버용 REST 키를 분리합니다.
  kakao-rest-key: ${KAKAO_REST_KEY:}
  kakao-js-key: ${KAKAO_JS_KEY:}
  tour-api-key: ${TOUR_API_KEY:}
  tour-api-daily-limit: ${TOUR_API_DAILY_LIMIT:300}
  gemini-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  ai-daily-limit: ${AI_DAILY_LIMIT:20}
  public-url: ${PUBLIC_URL:http://127.0.0.1:5173}
  mail-from: ${MAIL_FROM:}
  mail-enabled: ${MAIL_ENABLED:false}
  admin-email: ${ADMIN_EMAIL:}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 설치 없이 실행하는 개발/테스트 DB입니다. local,oracle을 함께 선택하면 아래 Oracle 설정이 우선합니다.
    url: jdbc:h2:file:./.data/travel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
app:
  sample-data: true
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
server:
  servlet:
    session:
      cookie:
        secure: true
app:
  sample-data: false
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      data-source-properties:
        # DATE는 날짜로, TIMESTAMP는 표준 JDBC 시각으로 받아 기존 API 형식을 유지합니다.
        oracle.jdbc.mapDateToTimestamp: false
        oracle.jdbc.J2EE13Compliant: true
  flyway:
    # 기존 H2/PostgreSQL에 적용한 파일의 체크섬을 바꾸지 않고 Oracle 전용 이력을 관리합니다.
    locations: classpath:db/oracle
