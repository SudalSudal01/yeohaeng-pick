name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # 실행 이미지와 액션의 커밋을 고정해 자동 버전 변경의 영향을 줄입니다.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Server HTTP and domain tests
        working-directory: backend
        run: chmod +x mvnw && ./mvnw --batch-mode verify
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
      - name: Verify web request contract
        working-directory: frontend
        run: npm test
      - name: Build web
        working-directory: frontend
        run: npm run build
